<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>

<body>
    <h1>Dom Events</h1>
    <!-- option 1 for event handlers -->
    <button onclick="console.log(7)">Click me</button>
    <button onclick="console.log(63)">Another Button</button>
    <button onclick="console.log('Iam clicked')">Third Button</button>
    <br>
    <!-- option 2 for event handlers -->
    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>
    <br>
    <button id="btn">Make Blue</button>
    <br>
    <button id="make-btn-purple">Make Purple</button>
    <button id="make-golden">Make Golden</button>
    <input type="text">
    <script>
        document.getElementById('make-golden').addEventListener('click', function () {
            document.body.style.backgroundColor = 'goldenrod';
        })
    </script>
    <script src="./js/events.js"></script>
</body>

</html>
